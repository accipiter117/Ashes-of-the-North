<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ashes of the North</title>
<meta name="description" content="A mobile-first settlement strategy game inspired by the Northern Kingdoms.">
<meta name="theme-color" content="#12151a">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1 id="settlementTitle">Ashes of the North</h1>
    </div>
    <div id="dateDisplay"></div>
  </header>

  <div id="resourceBar"></div>

  <main id="views">
    <section id="view-settlement" class="view active"></section>
    <section id="view-citizens" class="view"></section>
    <section id="view-build" class="view"></section>
    <section id="view-diplomacy" class="view"></section>
    <section id="view-explore" class="view"></section>
    <section id="view-research" class="view"></section>
    <section id="view-chronicle" class="view"></section>
    <section id="view-menu" class="view"></section>
  </main>

  <button id="turnBtn" title="Advance to the next month">Advance<br><span id="turnBtnSeason">Turn</span></button>

  <nav id="bottomNav">
    <button class="nav-btn active" data-view="settlement"><span class="nav-icon">🏘</span>Settlement</button>
    <button class="nav-btn" data-view="citizens"><span class="nav-icon">👥</span>People</button>
    <button class="nav-btn" data-view="build"><span class="nav-icon">🔨</span>Build</button>
    <button class="nav-btn" data-view="diplomacy"><span class="nav-icon">🕯</span>Diplomacy</button>
    <button class="nav-btn" data-view="explore"><span class="nav-icon">🧭</span>Explore</button>
    <button class="nav-btn" data-view="research"><span class="nav-icon">📜</span>Governance</button>
    <button class="nav-btn" data-view="chronicle"><span class="nav-icon">📖</span>Chronicle</button>
    <button class="nav-btn" data-view="menu"><span class="nav-icon">⚙</span>Menu</button>
  </nav>
</div>

<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack"></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
